<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="100%" stop-color="#fde047" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Crescent Moon -->
  <path d="M38 12C25.85 12 16 21.85 16 34C16 46.15 25.85 56 38 56C42.86 56 47.34 54.43 51 51.78C40.54 49.88 32.5 40.85 32.5 30C32.5 19.15 40.54 10.12 51 8.22C47.34 5.57 42.86 12 38 12Z" 
        fill="url(#moonGlow)" 
        filter="url(#softGlow)" />
  
  <!-- Tiny companion star dot -->
  <circle cx="48" cy="22" r="2.2" fill="#fff8db" />
</svg>
