<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .geo-line { stroke: rgba(140, 165, 235, 0.075); stroke-width: 1; fill: none; }
      .geo-circle { stroke: rgba(140, 165, 235, 0.08); stroke-width: 1; fill: none; }
      .geo-dot { fill: rgba(140, 165, 235, 0.12); }
    </style>
  </defs>
  
  <!-- Outer grid box -->
  <rect x="0.5" y="0.5" width="119" height="119" class="geo-line" stroke-dasharray="2,2" />
  
  <!-- Center circle -->
  <circle cx="60" cy="60" r="14" class="geo-circle" />
  <circle cx="60" cy="60" r="4" class="geo-circle" />
  
  <!-- Rotated square 1 (0 deg) -->
  <rect x="34" y="34" width="52" height="52" class="geo-line" />
  
  <!-- Rotated square 2 (45 deg) -->
  <rect x="34" y="34" width="52" height="52" class="geo-line" transform="rotate(45 60 60)" />

  <!-- Diagonal corner connectors -->
  <line x1="0" y1="0" x2="34" y2="34" class="geo-line" />
  <line x1="120" y1="0" x2="86" y2="34" class="geo-line" />
  <line x1="0" y1="120" x2="34" y2="86" class="geo-line" />
  <line x1="120" y1="120" x2="86" y2="86" class="geo-line" />

  <!-- Midpoint rays -->
  <line x1="60" y1="0" x2="60" y2="23" class="geo-line" />
  <line x1="60" y1="97" x2="60" y2="120" class="geo-line" />
  <line x1="0" y1="60" x2="23" y2="60" class="geo-line" />
  <line x1="97" y1="60" x2="120" y2="60" class="geo-line" />

  <!-- Corner dots -->
  <circle cx="60" cy="60" r="1.5" class="geo-dot" />
</svg>
